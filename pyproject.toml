[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "price_alert"
version = "1.0.0"
description = "基于 Gate.io 实时成交与动态 ATR 的合约价格异动提醒"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
  "websockets>=14,<17",
  # websockets 会自动使用系统代理且优先选 SOCKS，缺少此依赖时连接直接失败。
  "python-socks[asyncio]>=2.4,<3",
  "colorama>=0.4.6,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.9,<1"]

[project.scripts]
price_alert = "price_alert.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
