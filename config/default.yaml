# Gate.io 虚拟币 USDT 永续合约价格异动监控配置。
# 有硬性约束的数值项标注了取值范围（由 config.py 强制校验），影响判定或运行行为的项说明了调整后果；
# 改动阈值属于行为变更，提交说明中需写明运营影响。
# 未知键会直接报错（extra="forbid"），删掉某一项则回落到 config.py 中的同名默认值。

# 交易所连接、合约池筛选与限流。
gate:
  # REST 接口根地址，用于拉取合约列表与 K 线。一般只在切换测试网或代理时才改。
  rest_url: https://api.gateio.ws/api/v4
  # WebSocket 行情地址，推送 futures.trades 逐笔成交。须与 settle 对应。
  websocket_url: wss://fx-ws.gateio.ws/v4/ws/usdt
  # 结算币种，目前只支持 usdt。
  settle: usdt
  # 合约池准入门槛：24 小时 USDT 计价成交额必须严格大于该值。
  # 调低会纳入更多小币（异动更频繁，但流动性差、假信号多），调高则只盯主流币。
  min_volume_24h_quote: 10000000
  # 已在监控中的合约的退出门槛比例，成交额低于或等于 min_volume_24h_quote × 该比例即移除
  #（准入与退出都是「严格大于门槛才保留」，正好等于门槛的合约不会留下）。
  # 门槛线附近的合约成交额会反复穿越，留出这段缓冲可避免每轮刷新都反复订阅/退订。
  # 取值 (0, 1]，越小越黏（合约进来后更难被剔除），等于 1 表示进出同一条线。
  universe_exit_volume_ratio: 0.8
  # 合约池刷新周期（秒，60~86400）。变化通过增量订阅生效，不会断开 WebSocket。
  # 调小能更快发现新上线的热门合约，但每轮都要拉一次合约列表并为新增合约预热 K 线。
  universe_refresh_seconds: 600
  # 单个 REST 请求的超时（秒，>0 且 ≤60）。网络慢时调大，否则预热会因超时反复重试。
  rest_timeout_seconds: 15
  # 单个 REST 请求的最大尝试次数（1~10，含首次，不是额外重试次数）。
  # 只对 408/429/500/502/503/504 和网络、读取、JSON 解析类临时错误重试，其他状态码直接抛出。
  # 遇到 429 应下调下面的速率，而不是靠调高重试次数硬扛。
  rest_retries: 3
  # 所有 REST 出口共用的长期平均速率上限（次/秒，>0 且 ≤1000）。交易所按单位时间的请求数限频，
  # 而合约池大小只决定单轮请求数，所以上限必须加在时间维度上：合约池再大、断线重连再
  # 频繁，长期平均速率都收敛到该值，只会拉长一轮预热或回补的耗时。日志出现 429 就调小。
  rest_rate_limit_per_second: 10
  # 令牌桶攒满后可一次放行的瞬时额度（1~1000），让启动预热不必逐个等令牌。
  # 它是任意一刻的绝对上限，不应超过交易所在一个限频窗口内的配额：Gate 公共接口的官方口径是
  # 每个端点每 10 秒 200 次（响应头 X-Gate-RateLimit-Limit 实测同为 200），折合平均 20 次/秒。
  # 这里的令牌桶是所有端点共用的，比官方的按端点计算更保守。
  rest_rate_limit_burst: 20
  # ATR 预热与断线回补共用的并发上限（1~32），两者共用同一个信号量，峰值并发不会叠加。
  # 实际请求速率仍受上面的令牌桶约束，调大只影响并发排队深度。
  warmup_concurrency: 8
  # 单条订阅消息携带的合约数量（1~500）。Gate 一批中只要有一个无效合约就整批失败，
  # 之后会逐个重订阅定位问题合约；分片过大时这种回退代价更高，过小则订阅轮次变多。
  subscription_chunk_size: 100
  # 连续多少秒收不到任何数据消息（成交或订阅应答）就判定连接已死（秒，>0 且 ≤300），
  # 转成 ConnectionError 触发重连。底层 ping/pong 由 websockets 库独立维持，不会重置该计时。
  # 调小在全市场冷清时容易误判断线，调大则真正的死连接要更久才被发现。
  receive_timeout_seconds: 30
  # 实时成交允许的最大滞后（秒，>0 且 ≤300）。网络拥塞时成交会在链路上积压，推送过来的已是
  # 几十秒前的行情，秒级判定随之失去意义；逐笔校验时间戳，超限即主动断开重连以清空积压。
  # 日志频繁出现「行情数据滞后」说明网络链路不稳，应排查网络而不是调高该值。
  max_data_lag_seconds: 10
  # 断线重连的指数退避初始等待（秒，>0 且 ≤60）。收到第一笔成交后退避重置。
  reconnect_initial_seconds: 1
  # 退避上限（秒，>0 且 ≤300），不能小于 reconnect_initial_seconds。
  # 调大可减轻交易所故障期间的无效重连，代价是恢复后重新连上的延迟更长。
  reconnect_max_seconds: 30
  # 「监控正常」日志的最小间隔（秒，>0 且 ≤3600），打印当前监控的合约数与累计成交笔数
  #（有被拒订阅时附带数量）。检查点在每笔成交处理之后，全市场无成交时不会按时输出，
  # 所以它不是严格的心跳：日志沉默既可能是这里调大了，也可能是真的没有成交。
  # 只影响日志噪音，与检测逻辑无关。
  status_interval_seconds: 60

# ATR 与异动判定参数。触发条件需全部满足；基准桶、窗口成交笔数、涨跌幅与 ATR 倍数这些门槛
# 只要有一条不满足就重置确认进度，而补齐的空秒、空档后价格复核失败这两种情况只是禁止提醒，
# 确认进度会保留下来。
indicator:
  # ATR 使用的 K 线周期，仅支持 1m / 5m / 15m。
  # 周期越长 ATR 越平滑、门槛越稳，但对波动率变化的反应越慢。
  candle_interval: 1m
  # Wilder ATR 的平滑周期（2~200）。调大更平滑、对单根异常 K 线更不敏感，代价是门槛跟随波动率变化更慢。
  atr_period: 14
  # 启动时预拉的 K 线根数（15~500）。必须大于 atr_period：未收盘的当前 K 线不计入 seed，
  # 它转去初始化实时 K 线，只有已收盘的那些才喂给 ATR，所以可用根数通常比这里少一根。
  # 调大让初始 ATR 更接近稳态，代价是启动时每个合约的 REST 负担更重。
  warmup_candles: 50
  # 短时位移的观察窗口（秒，5~3600）：拿当前秒的 VWAP 与 lookback_seconds 秒前的桶比较。
  # 调小只抓瞬时急拉急砸，调大会把缓慢趋势也算进来。
  lookback_seconds: 30
  # 触发所需的 ATR 倍数（>0 且 ≤20）：窗口内位移 ÷ ATR ≥ 该值。
  # 这是随波动率自适应的门槛，调低提醒变多（尤其是高波动合约），调高只留下真正的异动。
  trigger_atr_multiple: 1.5
  # 触发所需的最低实际涨跌幅（百分比，>0 且 ≤100），与 ATR 倍数是「且」的关系。
  # 用于兜底：某些合约 ATR 极小，仅靠倍数会把微小波动放大成提醒。
  min_change_percent: 1.0
  # 需要连续满足门槛的相邻秒数（1~10），不能大于 lookback_seconds。
  # 调大能过滤单秒插针，代价是提醒延迟增加、快进快出的行情可能漏报。
  confirmation_seconds: 3
  # 观察窗口内的最低成交笔数（≥1）。过滤掉几笔成交就把价格打穿的流动性空窗。
  # 调大对冷门合约更严格，也更容易让它们完全不产生提醒。
  min_window_trades: 5
  # ATR 过期保护（秒，30~3600），按最近一根计入 ATR 的 K 线的收盘时间计算，超过则停止判定。
  # 不能小于两个 K 线周期；在 YAML 中删掉该项会自动取三个 K 线周期。
  # 调大能容忍更长的数据缺口，但可能拿过期的波动率基准发提醒。
  max_atr_age_seconds: 180

# 提醒冷却与分发通道。通道各有独立队列和后台任务，发送不会阻塞行情处理。
alerts:
  # 同一合约的提醒冷却时间（秒，0~86400），不分方向。合约从池中移除也不会清除冷却记录。
  # 调小会在一轮持续行情里反复提醒，调大则可能错过反向的第二波。
  cooldown_seconds: 30
  # 每个通知通道允许积压的提醒数量（1~100000）。队列满时丢弃新提醒并记错误日志，绝不阻塞成交循环。
  # 两种情况会填满：通道（尤其是 Webhook）长期慢于提醒产生速度，或全市场同时异动导致的瞬时突发。
  # 前者调大只是推迟丢弃，应先修通道；后者调大确实有效。
  queue_size: 1000
  # 是否输出控制台提醒。
  console: true
  # 控制台是否着色：暴涨绿色、暴跌红色。重定向到文件或日志系统时建议关掉。
  console_colors: true
  # 控制台提醒时是否发声。macOS 使用系统音效，其他平台用终端响铃（受终端设置影响）。
  beep: true
  # JSONL 落盘路径，相对当前工作目录解析。每行一条完整 JSON，进程异常退出也不会破坏既有记录。
  # 设为 null 可关闭该通道。
  jsonl_path: data/alerts/alerts.jsonl
  # 单个 JSONL 文件的轮转阈值（字节，≥0），整文件轮转为 .1、.2……0 表示不轮转。
  # 检查在写入前进行：文件达到阈值后仍会写完当前这条，因此实际大小可能超出阈值一条记录，
  # 且要等下一条提醒到来时才真正轮转（此后长期没有提醒，文件就一直停在超限状态）。
  jsonl_max_bytes: 10000000
  # 保留的历史 JSONL 文件数（1~100），超出的最旧文件会被删除。
  jsonl_backup_count: 5
  # Webhook 地址，null 表示不启用。环境变量 PRICE_ALERT_WEBHOOK_URL 会覆盖此项，
  # 地址通常含密钥，建议走环境变量而不是写进配置文件。
  webhook_url: null
  # Webhook 请求超时（秒，>0 且 ≤30）。超时只记日志、不重试，也不影响其他通道。
  webhook_timeout_seconds: 5
